name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-and-test:
    name: docker compose + pytest + Postman
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Подготовка журнала прогона
        run: |
          mkdir -p ci
          {
            echo "================================================================"
            echo "Прогон CI: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Коммит:    ${{ github.sha }}"
            echo "Раннер:    ${{ runner.os }} / ${{ runner.arch }}"
            echo "================================================================"
          } | tee ci/run.log

      - name: Версии инструментов
        run: |
          set -o pipefail
          {
            docker --version
            docker compose version
            node --version
            docker info --format '{{.ServerVersion}} / {{.OSType}} / {{.Architecture}}'
          } 2>&1 | tee -a ci/run.log

      - name: Проверка docker-compose.yml
        run: |
          set -o pipefail
          { echo; echo "--- docker compose config ---"; docker compose config; } 2>&1 | tee -a ci/run.log

      - name: Сборка multi-stage образа
        run: |
          set -o pipefail
          { echo; echo "--- docker compose build ---"; docker compose build --progress plain; } 2>&1 | tee -a ci/run.log

      - name: Запуск микросервиса и PostgreSQL
        run: |
          set -o pipefail
          { echo; echo "--- docker compose up ---"; docker compose up -d; } 2>&1 | tee -a ci/run.log

      - name: Ожидание готовности API
        run: |
          set -o pipefail
          {
            echo; echo "--- ожидание /health/live ---"
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8080/health/live >/dev/null 2>&1; then
                echo "health/live отвечает (попытка $i)"
                break
              fi
              sleep 2
            done
            echo "--- GET /health ---"
            curl -fsS http://localhost:8080/health
            echo
            echo "--- GET /api/v1/tasks ---"
            curl -fsS "http://localhost:8080/api/v1/tasks?limit=2"
            echo
          } 2>&1 | tee -a ci/run.log

      - name: Состояние контейнеров
        run: |
          set -o pipefail
          {
            echo; echo "--- docker compose ps ---"; docker compose ps
            echo; echo "--- docker compose images ---"; docker compose images
            echo; echo "--- docker image ls (все стадии) ---"; docker image ls
          } 2>&1 | tee -a ci/run.log

      - name: Интеграционные тесты (pytest в стадии test)
        run: |
          set -o pipefail
          echo; echo "--- docker build --target test ---" | tee -a ci/run.log
          docker build --target test -t task-tracker-api:test . 2>&1 | tee -a ci/run.log
          echo; echo "--- pytest ---" | tee -a ci/run.log
          rc=0
          docker run --rm --network task-tracker-net \
            -e DATABASE_URL=postgresql+psycopg://task_user:task_pass@db:5432/taskdb \
            task-tracker-api:test 2>&1 | tee ci/pytest.log | tee -a ci/run.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -c 900 ci/pytest.log | sed 's/%/%25/g; s/::/:/g' | tr '\n' '|')
            echo "::error title=pytest-exit-$rc::$msg"
            exit 1
          fi

      - name: Тесты Postman-коллекции (Newman)
        run: |
          set -o pipefail
          mkdir -p newman
          echo; echo "--- newman run ---" | tee -a ci/run.log
          rc=0
          npx --yes newman@6 run postman/task-tracker.postman_collection.json \
            -e postman/task-tracker.postman_environment.json \
            --reporters cli,json,junit \
            --reporter-json-export newman/report.json \
            --reporter-junit-export newman/report.xml \
            2>&1 | tee ci/newman.log | tee -a ci/run.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -c 900 ci/newman.log | sed 's/%/%25/g; s/::/:/g' | tr '\n' '|')
            echo "::error title=newman-exit-$rc::$msg"
            exit 1
          fi

      - name: Содержимое таблицы tasks после тестов
        if: always()
        run: |
          set -o pipefail
          {
            echo; echo "--- SELECT из tasks ---"
            docker compose exec -T db \
              psql -U task_user -d taskdb -c "SELECT id, title, status, priority FROM tasks ORDER BY id;"
          } 2>&1 | tee -a ci/run.log || true

      - name: Логи контейнера api (JSON-логирование)
        if: always()
        run: |
          set -o pipefail
          { echo; echo "--- docker compose logs api ---"; docker compose logs --no-color api | tail -n 12; } 2>&1 | tee -a ci/run.log || true

      - name: Выгрузка отчётов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman/
          if-no-files-found: ignore

      - name: Остановка
        if: always()
        run: |
          set -o pipefail
          { echo; echo "--- docker compose down ---"; docker compose down -v; } 2>&1 | tee -a ci/run.log || true

      # Диагностика без доступа к веб-интерфейсу: конец журнала выводится
      # аннотациями (они видны на странице прогона).
      - name: Аннотация с концом журнала
        if: always()
        run: |
          tail -c 14000 ci/run.log > /tmp/tail.txt
          total=$(wc -c < /tmp/tail.txt)
          offset=0
          idx=0
          while [ "$offset" -lt "$total" ]; do
            part=$(tail -c +$((offset + 1)) /tmp/tail.txt | head -c 950 | sed 's/%/%25/g; s/::/:/g' | tr '\n' '|')
            echo "::error title=CI-TAIL-$idx::${part}"
            offset=$((offset + 950))
            idx=$((idx + 1))
          done
