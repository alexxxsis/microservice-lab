# =====================================================================
#  Task Tracker API — микросервис + PostgreSQL, запускаются совместно.
#  Запуск:  docker compose up -d --build
#  Логи:    docker compose logs -f api
#  Стоп:    docker compose down            (с данными: down -v)
# =====================================================================
name: task-tracker

services:
  db:
    image: postgres:16-alpine
    container_name: task-tracker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
      POSTGRES_USER: ${POSTGRES_USER:-task_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты выполняются один раз, при создании пустого тома.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Проброс наружу нужен только для отладки (psql с хоста).
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: task-tracker-api:1.0.0
    container_name: task-tracker-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-task_user}:${POSTGRES_PASSWORD:-task_pass}@db:5432/${POSTGRES_DB:-taskdb}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_WAIT_SECONDS: "60"
      SERVICE_NAME: task-tracker-api
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

volumes:
  pgdata:
    name: task-tracker-pgdata

networks:
  backend:
    name: task-tracker-net
